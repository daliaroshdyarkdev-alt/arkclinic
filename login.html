<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-ar="تسجيل الدخول — آرك كلينك">Log in — ArkClinic</title>
  <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=22">
  <script src="assets/js/main.js?v=3" defer></script>
</head>
<body>
<div class="auth">
  <div class="auth-form">
    <div class="top">
      <a class="logo" href="index.html" aria-label="ArkClinic home">
        <svg viewBox="0 0 90 80" fill="none" aria-hidden="true"><defs><linearGradient id="ark-pulse-1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7A140E"/><stop offset=".35" stop-color="#C8281A"/><stop offset=".7" stop-color="#E8571E"/><stop offset="1" stop-color="#F5A623"/></linearGradient></defs><path d="M4 56H24L31 38L40 74L48 48L53 56H62C80 56 88 32 76 16C68 6 52 4 40 10" stroke="url(#ark-pulse-1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="10" r="5" fill="#F5A623"/></svg>
        <span>Ark<b>Clinic</b></span>
      </a>
      <button class="lang-btn" type="button" data-lang-toggle>عربي</button>
    </div>

    <div class="auth-body">
      <h1 data-ar="أهلاً بعودتك">Welcome back</h1>
      <p data-ar="سجّل الدخول لتشاهد يوم عيادتك.">Log in to see your clinic's day.</p>

      <!-- Mockup: the form opens the dashboard. Connect to your real login later. -->
      <form action="dashboard.html" method="get">
        <div class="field">
          <label for="l-user" data-ar="البريد الإلكتروني أو رقم الموبايل">Email or mobile number</label>
          <input id="l-user" type="text" required autocomplete="username" placeholder="you@clinic.com" data-ar-ph="you@clinic.com">
        </div>
        <div class="field">
          <label for="l-pass" data-ar="كلمة المرور">Password</label>
          <input id="l-pass" type="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <div class="row-between">
          <label class="check"><input type="checkbox" checked> <span data-ar="تذكرني">Remember me</span></label>
          <a class="link" href="#" data-ar="نسيت كلمة المرور؟">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" data-ar="تسجيل الدخول">Log in</button>
      </form>

      <p class="auth-alt"><span data-ar="عيادتك جديدة على آرك كلينك؟">New to ArkClinic?</span> <a class="link" href="signup.html" data-ar="أنشئ حسابًا">Create an account</a></p>
    </div>
  </div>

  <div class="auth-art" aria-hidden="true">
    <div class="hero-art">
      <div class="ring" style="width:440px;height:440px;inset-inline-start:4%;top:30px;border-color:#C9D5FB"></div>
      <div class="art-card art-main">
        <div class="art-head">
          <strong data-ar="جدول اليوم">Today's schedule</strong>
          <div class="art-dots"><i></i><i></i><i></i></div>
        </div>
        <div class="slot"><time>09:30</time><div class="who"><span class="avatar">MA</span><span data-ar="منى عادل">Mona Adel</span></div><span class="wa-dot"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l1.1-3.6A8 8 0 1 1 8.4 18.6z" fill="#25D366"/><path d="M9.3 8.7c.2-.5.5-.6.8-.6h.5c.2 0 .4 0 .5.4l.7 1.6c.1.2.1.4 0 .6l-.5.6c-.1.2-.2.3 0 .6.4.7 1 1.3 1.6 1.7.3.2.6.3.8.1l.6-.7c.2-.2.3-.2.5-.1l1.5.7c.3.1.4.2.4.4 0 .7-.4 1.4-1.1 1.6-.8.3-2 .2-3.6-.8-1.5-1-2.6-2.4-3-3.5-.3-.9-.1-1.9.3-2.4z" fill="#fff"/></svg></span></div>
        <div class="slot"><time>10:00</time><div class="who"><span class="avatar a2">KS</span><span data-ar="كريم سامي">Karim Samy</span></div><span class="wa-dot"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l1.1-3.6A8 8 0 1 1 8.4 18.6z" fill="#25D366"/><path d="M9.3 8.7c.2-.5.5-.6.8-.6h.5c.2 0 .4 0 .5.4l.7 1.6c.1.2.1.4 0 .6l-.5.6c-.1.2-.2.3 0 .6.4.7 1 1.3 1.6 1.7.3.2.6.3.8.1l.6-.7c.2-.2.3-.2.5-.1l1.5.7c.3.1.4.2.4.4 0 .7-.4 1.4-1.1 1.6-.8.3-2 .2-3.6-.8-1.5-1-2.6-2.4-3-3.5-.3-.9-.1-1.9.3-2.4z" fill="#fff"/></svg></span></div>
        <div class="slot"><time>10:30</time><div class="who"><span class="avatar a3">NH</span><span data-ar="نور حسن">Nour Hassan</span></div><span class="wa-dot"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l1.1-3.6A8 8 0 1 1 8.4 18.6z" fill="#25D366"/><path d="M9.3 8.7c.2-.5.5-.6.8-.6h.5c.2 0 .4 0 .5.4l.7 1.6c.1.2.1.4 0 .6l-.5.6c-.1.2-.2.3 0 .6.4.7 1 1.3 1.6 1.7.3.2.6.3.8.1l.6-.7c.2-.2.3-.2.5-.1l1.5.7c.3.1.4.2.4.4 0 .7-.4 1.4-1.1 1.6-.8.3-2 .2-3.6-.8-1.5-1-2.6-2.4-3-3.5-.3-.9-.1-1.9.3-2.4z" fill="#fff"/></svg></span></div>
      </div>
      <div class="art-card art-money">
        <div class="label" data-ar="تحصيل اليوم">Collected today</div>
        <div class="amount" data-ar="8,450 ج.م">EGP 8,450</div>
        <div class="mini-bars"><i style="height:40%"></i><i style="height:62%"></i><i style="height:48%"></i><i style="height:75%"></i><i style="height:58%"></i><i style="height:84%"></i><i class="on" style="height:100%"></i></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
