<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-ar="إنشاء حساب — آرك كلينك">Sign up — ArkClinic</title>
  <link rel="icon" href="assets/img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=22">
  <script src="assets/js/main.js?v=3" defer></script>
</head>
<body>
<div class="auth">
  <div class="auth-form">
    <div class="top">
      <a class="logo" href="index.html" aria-label="ArkClinic home">
        <svg viewBox="0 0 90 80" fill="none" aria-hidden="true"><defs><linearGradient id="ark-pulse-1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7A140E"/><stop offset=".35" stop-color="#C8281A"/><stop offset=".7" stop-color="#E8571E"/><stop offset="1" stop-color="#F5A623"/></linearGradient></defs><path d="M4 56H24L31 38L40 74L48 48L53 56H62C80 56 88 32 76 16C68 6 52 4 40 10" stroke="url(#ark-pulse-1)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40" cy="10" r="5" fill="#F5A623"/></svg>
        <span>Ark<b>Clinic</b></span>
      </a>
      <button class="lang-btn" type="button" data-lang-toggle>عربي</button>
    </div>

    <div class="auth-body">
      <h1 data-ar="ابدأ عيادتك على آرك كلينك">Start your clinic on ArkClinic</h1>
      <p data-ar="جاهز في دقائق. مجاني لمدة 14 يومًا.">Ready in minutes. Free for 14 days.</p>

      <!-- Mockup: the form opens the dashboard. Connect to your real sign-up later. -->
      <form action="dashboard.html" method="get">
        <div class="form-grid">
          <div class="field">
            <label for="s-name" data-ar="اسمك">Your name</label>
            <input id="s-name" type="text" required autocomplete="name" placeholder="Dr. Salma Nabil" data-ar-ph="د. سلمى نبيل">
          </div>
          <div class="field">
            <label for="s-clinic" data-ar="اسم العيادة">Clinic name</label>
            <input id="s-clinic" type="text" required placeholder="Nile Family Clinic" data-ar-ph="عيادة النيل للأسرة">
          </div>
          <div class="field">
            <label for="s-phone" data-ar="رقم الموبايل (واتساب)">Mobile (WhatsApp)</label>
            <input id="s-phone" type="tel" required autocomplete="tel" placeholder="010 0000 0000">
          </div>
          <div class="field">
            <label for="s-plan" data-ar="الباقة">Plan</label>
            <select id="s-plan">
              <option data-ar="الأساسية — 450 ج.م">Starter — EGP 450</option>
              <option selected data-ar="العيادة — 950 ج.م">Clinic — EGP 950</option>
              <option data-ar="الاحترافية — 1,750 ج.م">Pro — EGP 1,750</option>
            </select>
          </div>
          <div class="field full">
            <label for="s-email" data-ar="البريد الإلكتروني">Email</label>
            <input id="s-email" type="email" required autocomplete="email" placeholder="you@clinic.com">
          </div>
          <div class="field full">
            <label for="s-pass" data-ar="كلمة المرور">Password</label>
            <input id="s-pass" type="password" required minlength="8" autocomplete="new-password" placeholder="8+ characters" data-ar-ph="8 أحرف على الأقل">
          </div>
          <div class="full">
            <label class="check"><input type="checkbox" required> <span data-ar="أوافق على الشروط وسياسة الخصوصية">I agree to the terms and privacy policy</span></label>
          </div>
          <div class="full">
            <button class="btn btn-primary btn-lg btn-block" type="submit" data-ar="أنشئ الحساب">Create account</button>
          </div>
        </div>
      </form>

      <p class="auth-alt"><span data-ar="عندك حساب بالفعل؟">Already have an account?</span> <a class="link" href="login.html" data-ar="سجّل الدخول">Log in</a></p>
    </div>
  </div>

  <div class="auth-art" aria-hidden="true">
    <div class="hero-art">
      <div class="ring" style="width:440px;height:440px;inset-inline-start:4%;top:30px;border-color:#C9D5FB"></div>
      <div class="art-card art-main" style="padding:26px">
        <div class="art-head"><strong data-ar="إعداد العيادة">Clinic setup</strong><div class="art-dots"><i></i><i></i><i></i></div></div>
        <div class="setup-list" style="margin:0 -26px">
          <a><span class="icon"><svg viewBox="0 0 24 24" class="ic"><path d="M4 21V9l8-5 8 5v12M9 21v-6h6v6"/></svg></span><span data-ar="بيانات العيادة">Clinic details</span><svg class="chev ic" style="color:var(--teal)" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
          <a><span class="icon"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><span data-ar="الأطباء">Doctors</span><svg class="chev ic" style="color:var(--teal)" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
          <a><span class="icon"><svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><span data-ar="مواعيد العمل">Working hours</span><svg class="chev ic" style="color:var(--teal)" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
          <a><span class="icon"><svg viewBox="0 0 24 24" class="ic"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18"/></svg></span><span data-ar="طرق الدفع">Payment methods</span><svg class="chev ic flip" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></a>
        </div>
      </div>
      <div class="art-card art-msg" style="inset-block-start:auto;inset-block-end:20px;inset-inline-end:0">
        <div class="meta"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l1.1-3.6A8 8 0 1 1 8.4 18.6z" fill="#25D366"/><path d="M9.3 8.7c.2-.5.5-.6.8-.6h.5c.2 0 .4 0 .5.4l.7 1.6c.1.2.1.4 0 .6l-.5.6c-.1.2-.2.3 0 .6.4.7 1 1.3 1.6 1.7.3.2.6.3.8.1l.6-.7c.2-.2.3-.2.5-.1l1.5.7c.3.1.4.2.4.4 0 .7-.4 1.4-1.1 1.6-.8.3-2 .2-3.6-.8-1.5-1-2.6-2.4-3-3.5-.3-.9-.1-1.9.3-2.4z" fill="#fff"/></svg><span data-ar="رسالة ترحيب">Welcome message</span></div>
        <div class="bubble" data-ar="أهلاً بك في عيادة النيل. تم تأكيد حجزك.">Welcome to Nile Clinic. Your booking is confirmed.</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
